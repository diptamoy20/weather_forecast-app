services:
  - type: web
    name: weather-api
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: /opt/render/project/src/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: OPENWEATHER_API_KEY
        sync: false          # Set manually in Render dashboard — never commit secrets
      - key: ALLOWED_ORIGINS
        sync: false          # Set to your Vercel URL after frontend is deployed
